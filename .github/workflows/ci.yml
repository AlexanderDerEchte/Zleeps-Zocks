name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK (Plattform 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      - name: Unit- und UI-Tests (Robolectric)
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: zocks-zleep-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: berichte
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
